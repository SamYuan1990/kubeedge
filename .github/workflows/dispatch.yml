name: Dispatch Trigger as expirement for SamYuan1990/OpenAI_CodeAgent-action

on:
  workflow_dispatch:

permissions: write-all

env:
  GINKGO_VERSION: "v2.9.5"

jobs:
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.x

      - name: Install dependencies
        run: |
          command -v ginkgo || go install github.com/onsi/ginkgo/v2/ginkgo@${{ env.GINKGO_VERSION }}

      - name: unittest
        id: unittest
        run: |
          make test PROFILE=y

      - name: Test Local Action
        id: test-action
        uses: SamYuan1990/OpenAI_CodeAgent-action@main
        with:
          baseURL: https://api.deepseek.com
          apiKey: ${{ secrets.API_KEY }}
          fileOverWrite: true
          model: deepseek-chat
          dirPath: ./
          prompt: please help generate go doc for this function 
          maxIterations: 3
          runType: godoc

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.MyPATToken }} # 使用 GitHub 提供的 token
          branch: auto-pr-branch # 新分支名称
          base: master # 目标分支
          title: 'Automated PR: Update generated files with go doc'
          body: 'This is an automated pull request created by GitHub Actions.'
          commit-message: 'Auto-generated changes for go doc'
          sign-commits: true
          labels: automated # 可选：为 PR 添加标签
